name: Android TV video experiment

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/android-tv-video]

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Limit Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2G
          EOF
      - name: Build isolated Android TV APK
        shell: pwsh
        run: ./build-android-tv-video.ps1
      - name: Check video profile
        run: >-
          flutter test --no-pub --concurrency=1
          test/util/video_app_profile_test.dart
          test/di/video_module_startup_test.dart
          test/preference/video_app_profile_preference_test.dart
          test/data/repositories/user_views_repository_test.dart
          test/data/services/plugin_sync_service_loop_test.dart
          test/util/focus/android_tv_navigation_scope_test.dart
          test/ui/widgets/back_to_exit_test.dart
          test/ui/widgets/focus/row_glide_test.dart
          test/ui/widgets/focus/tv_scroll_controller_test.dart
          test/ui/widgets/offline_aware_image_decode_test.dart
          test/playback/restart_video_test.dart
          test/playback/osd_buttons_test.dart
          test/viewmodels/item_detail_episode_ordering_test.dart
          test/ui/navigation/seerr_routes_test.dart
          test/viewmodels/search_view_model_smart_test.dart
      - name: Check TV Seerr navigation
        run: >-
          flutter test --no-pub --concurrency=1
          test/ui/widgets/navigation_chrome_registration_test.dart
          --plain-name 'TV Seerr navigation'
      - uses: actions/upload-artifact@v6
        with:
          name: android-tv-video
          path: artifacts/android-tv-video/release-android-arm64/
