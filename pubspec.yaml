name: moonfin
description: "Moonfin Android TV video browsing and playback experiment"
publish_to: 'none'
version: 3.0.0+30000156

moonfin:
  android_tv_version: 3.0.0
  android_tv_build_number: 2000023
  beta: false
  beta_number: 1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.2.2
  # moonfin:// deep links on Android TV
  app_links: ^7.2.1
  animated_reorderable_list: ^1.3.0

  # State Management & DI
  get_it: ^9.2.1
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.11.1
  background_downloader: ^9.6.0
  ffi: ^2.1.0
  web_socket_channel: ^3.0.3
  # Decodes imported .p12/.pfx client certificates
  pointycastle: ^4.0.0

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  drift: ^2.28.2
  sqlite3_flutter_libs: 0.5.42
  sqlite3: ^2.7.0

  # Android TV video playback: Media3 plus mpv fallback
  # mpv_frame_sampler_native.dart imports media_kit's NativeLibrary and libmpv
  # bindings from src/, so check that file when moving this pin.
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  # Image Loading
  # Vendored fork of cached_network_image 3.4.1 that skips decoding an image
  # again once it's been shown, since that second decode painted blank on
  # Firefox web. See packages/cached_network_image_fork/pubspec.yaml.
  cached_network_image:
    path: packages/cached_network_image_fork
  flutter_cache_manager: ^3.4.1
  # Direct because the image cache index stamps its entries with clock.now(),
  # the same clock the cache manager reads, so a test can drive both. Keep in
  # step with what flutter_cache_manager resolves.
  clock: ^1.1.2
  # Direct because the image cache wraps the cache manager's file service in a
  # client of its own. Keep in step with what flutter_cache_manager resolves.
  http: ^1.6.0
  flutter_svg: ^2.2.1
  # Parses the seasonal effects' artwork into paths for the sprite atlas.
  path_parsing: ^1.1.0

  # Crypto
  crypto: ^3.0.6

  # Connectivity
  connectivity_plus: ^7.1.1

  flutter_local_notifications: ^21.0.0
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  rxdart: ^0.28.0
  device_info_plus: ^11.5.0
  json_annotation: ^4.9.0
  logger: ^2.7.0
  intl: ^0.20.2
  punycoder: ^0.3.0
  collection: ^1.19.1
  package_info_plus: ^8.3.1
  uuid: ^4.5.3
  cupertino_icons: ^1.0.9
  # Flutter bundles the older Material Icons font, which has no crown or owl
  # for the achievement avatars to wear. Tree shaking keeps only the glyphs
  # actually named.
  material_symbols_icons: ^4.2960.0
  server_core:
    path: packages/server_core
  server_jellyfin:
    path: packages/server_jellyfin
  server_emby:
    path: packages/server_emby
  server_plex:
    path: packages/server_plex
  server_silo:
    path: packages/server_silo
  playback_core:
    path: packages/playback_core
  playback_jellyfin:
    path: packages/playback_jellyfin
  playback_emby:
    path: packages/playback_emby
  playback_plex:
    path: packages/playback_plex
  playback_silo:
    path: packages/playback_silo
  moonfin_design:
    path: packages/design
  jellyfin_preference:
    path: packages/preference
  moonfin_native_video:
    path: packages/moonfin_native_video
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  emoji_picker_flutter: ^4.5.4
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  youtube_player_iframe: ^6.0.0
  screen_brightness_platform_interface: ^2.1.0
  screen_brightness_android: ^2.1.3
  wakelock_plus: ^1.3.3
  volume_controller: ^3.6.1
  web: ^1.1.1
  custom_tv_text_field:
    path: packages/custom_tv_text_field_fork
  speech_to_text: ^7.3.0
  qr_flutter: ^4.1.0

  # 1.1.1 fixed a startup race where the configure call could be silently
  # lost, leaving the engine's aggressive default remote tuning active.
  pointer_interceptor: ^0.10.1+2
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Live admin checks against a test server (integration_test/admin).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  drift_dev: ^2.28.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  # flutter_cache_manager hands widgets package:file handles, so a test that
  # stands in for a disk hit has to build one. Keep in step with what the
  # cache manager resolves.
  file: ^7.0.1
  wakelock_plus_platform_interface: ^1.5.1
  # Lets a test stand in for the Android side of path_provider.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

dependency_overrides:
  # objective_c 9.3.0's build hook imports a private path out of
  # native_toolchain_c, which stopped compiling on the Flutter 3.47 SDK and takes
  # `flutter test` down with it. 9.4.1 drops that import.
  objective_c: ^9.4.1
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video_full
  background_downloader:
    git:
      url: https://github.com/RadicalMuffinMan/background_downloader.git
      ref: e4d6fe85387195b972ff9d79a907d540f294b4e7
  # Fork of 2.0.1 carrying a Linux renderer fix: an EGLImage that NVIDIA leaves
  # idle under Wayland stops presenting, so a long gap between mpv frames
  # rebuilds the texture, and frame notifications move onto the main thread.
  # The pinned commit sits ahead of the published release, so it also carries
  # unreleased upstream work on the Apple and Dart sides. Re-check those builds
  # when moving the ref, and drop this once the fix reaches a published version.
  media_kit_video:
    git:
      url: https://github.com/RadicalMuffinMan/media-kit.git
      path: media_kit_video
      ref: 50013aee7429633ae2df656982167ca6d21237ce
  synchronized: 3.3.1
  wakelock_plus: 1.3.3
  screen_brightness_android: 2.1.3
  screen_brightness_platform_interface: 2.1.0
  volume_controller: 3.6.1
  universal_platform: 1.1.0
  plugin_platform_interface: 2.1.8
  web: 1.1.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Bundled so AppBeta can read the beta flag back at runtime, which keeps
    # pubspec the one place the beta number is written.
    - pubspec.yaml
    - assets/images/
    - assets/icons/
    - assets/icons/ratings/
    - assets/icons/social/
    - assets/fonts/
    - assets/subtitle_fonts/

  fonts:
    # The web engine fetches Roboto from fonts.gstatic.com unless it finds a
    # family of that name here. Material typography asks for Roboto, so this
    # is the font nearly all of the UI renders in.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: NeonPulseDisplay
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: NeonPulseBody
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: EightBitHero
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600

